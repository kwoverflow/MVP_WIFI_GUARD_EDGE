# LAN-only pilot. Add TLS before Internet exposure; do NOT forward :8000/:5432.
map "$scheme:$remote_addr" $wifiguard_network_transport {
    default "plain";
    ~^https: "https";
    "http:127.0.0.1" "loopback";
    "http:::1" "loopback";
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    # Loopback proxying must NEVER open the trusted local ingestion endpoint.
    location ^~ /internal/ { return 404; }
    location ^~ /api/v1/training { return 403; } # local MLOps/training excluded
    location ^~ /api/v1/local-edge/network/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Wifiguard-Network-Transport $wifiguard_network_transport;
        proxy_read_timeout 45s;
        client_max_body_size 4k;
    }
    location /api/ { proxy_pass http://127.0.0.1:8000; }
    location = /health { proxy_pass http://127.0.0.1:8000; }
    location = /ports { proxy_pass http://127.0.0.1:8000; }
    location /realtime/ { proxy_pass http://127.0.0.1:8000; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host:$server_port;
    }
}
